      <stop offset="0" stop-color="#0c5a91"/>
      <stop offset="1" stop-color="#164a76"/>
    </linearGradient>
    <linearGradient id="qwen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#725cff"/>
