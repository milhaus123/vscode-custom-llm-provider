  <text x="24" y="173" fill="#878e9a" font-size="11" font-weight="700" letter-spacing="0.8">RECENT</text>
  <rect x="14" y="187" width="232" height="58" rx="8" fill="#2b2e34"/>
  <circle cx="34" cy="208" r="5" fill="#43d4aa"/>
