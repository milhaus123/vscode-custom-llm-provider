  <rect x="490" y="130" width="672" height="88" rx="14" fill="url(#user)"/>
  <text x="516" y="159" fill="#9dd7ff" font-size="12" font-weight="700" letter-spacing="0.6">YOU</text>
  <rect x="516" y="174" width="68" height="27" rx="13.5" fill="#113956" stroke="#6cc2ff"/>
  <text x="529" y="193" fill="#bce5ff" font-size="13" font-weight="650">@qwen</text>
  <text x="597" y="193" fill="#ffffff" font-size="14">Review the key migration and update its documentation.</text>

  <!-- Participant response -->
  <rect x="300" y="244" width="790" height="246" rx="16" fill="#25282d" stroke="#373c45"/>
  <rect x="326" y="269" width="38" height="38" rx="11" fill="url(#qwen)"/>
  <circle cx="341" cy="288" r="5" fill="#ffffff"/>
  <circle cx="352" cy="280" r="4.5" fill="#ffffff" opacity="0.88"/>
  <circle cx="352" cy="296" r="4.5" fill="#ffffff" opacity="0.88"/>
  <path d="m345 286 4-4m-4 8 4 4" stroke="#253b83" stroke-width="2" stroke-linecap="round"/>
  <text x="379" y="284" fill="#8bbcff" font-size="14" font-weight="700">@qwen</text>
  <text x="379" y="303" fill="#7f8794" font-size="11">Custom LLM participant · Qwen3.6 Plus</text>

  <text x="326" y="340" fill="#e0e3e8" font-size="14">Verified the v0.5.0 migration path and updated the README:</text>

