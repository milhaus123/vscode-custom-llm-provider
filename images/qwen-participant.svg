  <path d="m332 373 3 3 6-7" fill="none" stroke="#5ce1b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356" y="378" fill="#ced3dc" font-size="13">Keys are stored through VS Code SecretStorage.</text>
  <circle cx="336" cy="406" r="8" fill="#174b3f"/>
  <path d="m332 406 3 3 6-7" fill="none" stroke="#5ce1b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356" y="411" fill="#ced3dc" font-size="13">Plaintext values are removed from user, workspace, and folder settings.</text>
  <circle cx="336" cy="439" r="8" fill="#174b3f"/>
  <path d="m332 439 3 3 6-7" fill="none" stroke="#5ce1b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356" y="444" fill="#ced3dc" font-size="13">The key remains attached when a provider is renamed.</text>

  <rect x="326" y="458" width="284" height="25" rx="6" fill="#191b1f"/>
  <text x="340" y="475" fill="#9cdcfe" font-size="12" font-family="'Cascadia Code', Consolas, monospace">README.md</text>
  <text x="417" y="475" fill="#6f7785" font-size="12">+ secure-storage documentation</text>

  <!-- Non-sticky notice -->
  <rect x="860" y="262" width="202" height="56" rx="10" fill="#332f1f" stroke="#665d32"/>
  <circle cx="882" cy="290" r="8" fill="#e7bd45"/>
  <text x="879" y="294" fill="#3a2e0f" font-size="11" font-weight="800">i</text>
  <text x="900" y="283" fill="#f0dda2" font-size="11" font-weight="650">Per-turn participant</text>
  <text x="900" y="301" fill="#b9aa7a" font-size="10">@qwen is not sticky</text>

  <!-- Chat input -->
  <rect x="300" y="520" width="862" height="98" rx="14" fill="#14161a" stroke="#484d57"/>
