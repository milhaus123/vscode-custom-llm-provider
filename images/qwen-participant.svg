  <text x="50" y="231" fill="#8c939f" font-size="11">Custom LLM · just now</text>
  <text x="24" y="278" fill="#b3b7bf" font-size="13">Provider model discovery</text>
  <text x="24" y="318" fill="#b3b7bf" font-size="13">Fix streaming tool calls</text>

  <!-- Chat header -->
  <rect x="260" y="44" width="940" height="58" fill="#24262a"/>
  <text x="288" y="80" fill="#f2f3f5" font-size="17" font-weight="650">Secure API key migration</text>
  <rect x="983" y="58" width="124" height="30" rx="15" fill="#283029" stroke="#3e5b49"/>
  <circle cx="1003" cy="73" r="5" fill="#43d4aa"/>
