  <rect x="404" y="572" width="184" height="30" rx="8" fill="#2a2d33"/>
  <circle cx="422" cy="587" r="5" fill="#61aaff"/>
  <text x="436" y="592" fill="#d9dce2" font-size="12">Qwen3.6 Plus</text>
  <circle cx="1124" cy="587" r="16" fill="#0e639c"/>
  <path d="m1118 587 6-6 6 6M1124 581v12" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="0" y="637" width="1200" height="38" fill="#0078d4"/>
  <text x="600" y="662" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Use @qwen for a single turn; without it, Chat keeps using the model selected in the picker.</text>
</svg>
