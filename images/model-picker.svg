<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="editor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="22" fill="#18191c"/>
  <rect width="1200" height="44" rx="22" fill="#2b2d31"/>
  <rect y="32" width="1200" height="12" fill="#2b2d31"/>
  <circle cx="22" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="7" fill="#febc2e"/>
  <circle cx="70" cy="22" r="7" fill="#28c840"/>
  <text x="600" y="28" text-anchor="middle" fill="#c8c8c8" font-size="14">Visual Studio Code — Chat</text>

  <!-- Activity bar and editor -->
  <rect x="0" y="44" width="50" height="593" fill="#18191c"/>
  <rect x="50" y="44" width="660" height="593" fill="url(#editor)"/>
  <rect x="50" y="44" width="660" height="37" fill="#24262a"/>
  <rect x="50" y="44" width="204" height="37" fill="#1e1e1e"/>
  <text x="72" y="68" fill="#d2d2d2" font-size="13">extension.ts</text>
  <circle cx="235" cy="62" r="4" fill="#d8a344"/>
  <g fill="none" stroke="#858891" stroke-width="2">
    <rect x="16" y="68" width="18" height="21" rx="2"/>
    <circle cx="25" cy="125" r="10"/>
    <path d="M17 160h16M17 166h16M17 172h10"/>
    <path d="M17 205h16l-8 13z"/>
  </g>

  <!-- Code -->
  <g font-family="'Cascadia Code', Consolas, monospace" font-size="14">
    <text x="76" y="116" fill="#6a9955">// Models are discovered from every configured provider</text>
    <text x="76" y="148" fill="#c586c0">const</text>
    <text x="122" y="148" fill="#9cdcfe"> models </text>
    <text x="181" y="148" fill="#d4d4d4">= </text>
    <text x="200" y="148" fill="#c586c0">await</text>
    <text x="246" y="148" fill="#dcdcaa"> discoverAllModels</text>
    <text x="388" y="148" fill="#d4d4d4">(apiKeys);</text>
    <text x="76" y="180" fill="#c586c0">const</text>
    <text x="122" y="180" fill="#9cdcfe"> provider </text>
    <text x="198" y="180" fill="#d4d4d4">= </text>
    <text x="217" y="180" fill="#c586c0">new</text>
    <text x="250" y="180" fill="#4ec9b0"> CustomLlmProvider</text>
    <text x="397" y="180" fill="#d4d4d4">(apiKeys);</text>
    <text x="76" y="212" fill="#4ec9b0">vscode</text>
    <text x="125" y="212" fill="#d4d4d4">.</text>
    <text x="133" y="212" fill="#9cdcfe">lm</text>
    <text x="150" y="212" fill="#d4d4d4">.</text>
    <text x="158" y="212" fill="#dcdcaa">registerLanguageModelChatProvider</text>
    <text x="430" y="212" fill="#d4d4d4">(</text>
    <text x="438" y="212" fill="#ce9178">'custom-llm'</text>
    <text x="542" y="212" fill="#d4d4d4">, provider);</text>
  </g>
  <rect x="82" y="270" width="544" height="210" rx="14" fill="#202328" stroke="#333842"/>
  <text x="108" y="306" fill="#f0f2f6" font-size="15" font-weight="650">Extension status</text>
  <circle cx="110" cy="341" r="6" fill="#3dd5a7"/>
  <text x="129" y="347" fill="#cfd4df" font-size="14">Custom LLM Provider active</text>
  <circle cx="110" cy="379" r="6" fill="#3dd5a7"/>
  <text x="129" y="385" fill="#cfd4df" font-size="14">9 models discovered from Alibaba DashScope</text>
  <circle cx="110" cy="417" r="6" fill="#3dd5a7"/>
  <text x="129" y="423" fill="#cfd4df" font-size="14">API key loaded from secure storage</text>
  <circle cx="110" cy="455" r="6" fill="#4e9cff"/>
  <text x="129" y="461" fill="#cfd4df" font-size="14">Models registered with VS Code Chat</text>

  <!-- Chat panel -->
  <rect x="710" y="44" width="490" height="593" fill="#202226"/>
  <rect x="710" y="44" width="490" height="52" fill="#25272b"/>
  <text x="734" y="76" fill="#f3f4f6" font-size="17" font-weight="650">Chat</text>
  <circle cx="1120" cy="70" r="3" fill="#a0a4ad"/>
  <circle cx="1133" cy="70" r="3" fill="#a0a4ad"/>
  <circle cx="1146" cy="70" r="3" fill="#a0a4ad"/>
  <rect x="742" y="121" width="426" height="72" rx="12" fill="#292c31"/>
  <text x="763" y="148" fill="#8f96a3" font-size="12" font-weight="700">YOU</text>
  <text x="763" y="174" fill="#e9eaed" font-size="14">Explain how API keys are migrated in v0.5.0.</text>
  <rect x="742" y="211" width="390" height="108" rx="12" fill="#26292e"/>
  <rect x="760" y="229" width="26" height="26" rx="7" fill="#316fd1"/>
  <path d="M768 242h10M773 237v10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="797" y="247" fill="#79b7ff" font-size="13" font-weight="650">Custom LLM</text>
  <text x="760" y="281" fill="#d1d4da" font-size="13">Keys move to SecretStorage before plaintext</text>
  <text x="760" y="303" fill="#d1d4da" font-size="13">is removed from each settings scope.</text>

  <!-- Input -->
  <rect x="734" y="492" width="442" height="124" rx="14" fill="#181a1e" stroke="#484d57"/>
  <text x="756" y="526" fill="#777e8b" font-size="14">Ask about your codebase</text>
  <rect x="752" y="565" width="75" height="32" rx="8" fill="#2a2d33"/>
  <text x="772" y="586" fill="#d0d3d9" font-size="12">Agent</text>
  <path d="m810 578 5 5 5-5" fill="none" stroke="#9399a4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="837" y="565" width="181" height="32" rx="8" fill="#183d68" stroke="#327bb6"/>
  <circle cx="855" cy="581" r="5" fill="#65adff"/>
  <text x="869" y="586" fill="#ffffff" font-size="12" font-weight="600">Qwen3.6 Plus</text>
  <path d="m997 578 5 5 5-5" fill="none" stroke="#9ecdf5" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="1143" cy="581" r="16" fill="#0e639c"/>
  <path d="m1137 581 6-6 6 6M1143 575v12" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Current model dropdown -->
  <g filter="url(#shadow)">
    <rect x="745" y="102" width="416" height="378" rx="14" fill="#25282d" stroke="#555b66"/>
  </g>
  <rect x="763" y="120" width="380" height="38" rx="8" fill="#191b1f" stroke="#41464f"/>
  <circle cx="782" cy="139" r="7" fill="none" stroke="#8d939f" stroke-width="1.5"/>
  <path d="m787 144 6 6" stroke="#8d939f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="803" y="144" fill="#858c98" font-size="13">Search models</text>

  <text x="769" y="187" fill="#8f96a3" font-size="11" font-weight="700" letter-spacing="0.9">CUSTOM LLM</text>
  <rect x="761" y="198" width="384" height="50" rx="8" fill="#103f67"/>
  <circle cx="782" cy="223" r="6" fill="#61b2ff"/>
  <text x="800" y="219" fill="#ffffff" font-size="14" font-weight="650">Qwen3.6 Plus</text>
  <text x="800" y="237" fill="#acd4f5" font-size="11">Alibaba DashScope · 1M context</text>
  <path d="m1115 222 6 6 11-14" fill="none" stroke="#6fe0bb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="782" cy="273" r="6" fill="#747b88"/>
  <text x="800" y="269" fill="#e0e2e6" font-size="14">Qwen3 Coder Plus</text>
  <text x="800" y="287" fill="#858c98" font-size="11">Alibaba DashScope · 128K context</text>

  <circle cx="782" cy="323" r="6" fill="#747b88"/>
  <text x="800" y="319" fill="#e0e2e6" font-size="14">Kimi K2.5</text>
  <text x="800" y="337" fill="#858c98" font-size="11">Alibaba DashScope · 256K context</text>

  <circle cx="782" cy="373" r="6" fill="#747b88"/>
  <text x="800" y="369" fill="#e0e2e6" font-size="14">MiniMax M2.5</text>
  <text x="800" y="387" fill="#858c98" font-size="11">Alibaba DashScope · 256K context</text>

  <line x1="763" y1="410" x2="1143" y2="410" stroke="#40454e"/>
  <rect x="763" y="425" width="380" height="38" rx="8" fill="#2b2e34"/>
  <path d="M781 437h16v14h-16zM785 433h8v4" fill="none" stroke="#a5abb6" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="811" y="449" fill="#d7dae0" font-size="13">Manage Language Models</text>
  <text x="1122" y="449" fill="#a3a9b4" font-size="17">›</text>

  <rect x="0" y="637" width="1200" height="38" fill="#0078d4"/>
  <text x="600" y="662" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Custom LLM models appear in the current VS Code Chat model picker.</text>
</svg>
